[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-md-audit"
version = "0.1.0"
description = "Audit AGENTS.md and other AI agent instruction files for stale paths, broken commands, conflicting rules and bloat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["agents-md", "ai-agents", "coding-agents", "llm", "lint", "audit", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agent-md-audit = "agent_md_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_md_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
